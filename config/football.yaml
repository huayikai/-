# Shared development protocol; CLI overrides are applied last.
# New football runs only: historical SC2 and gfootball.yaml are unchanged.
common:
  seed: 79
  runner: parallel
  batch_size_run: 4
  buffer_size: 2000
  batch_size: 64
  t_max: 5050000
  gamma: 0.99
  td_lambda: 0.3
  lr: 0.001
  epsilon_start: 1.0
  epsilon_finish: 0.05
  epsilon_anneal_time: 500000
  rnn_hidden_dim: 64
  test_nepisode: 100
  # Independent simulator processes and RNG streams for evaluation.
  football_eval_separate_envs: True
  test_interval: 10000
  log_interval: 10000
  runner_log_interval: 10000
  learner_log_interval: 10000
  use_tensorboard: True
  save_model: True
  save_model_interval: 1000000
  local_results_path: ablation_results_football
env_args:
  # Reproducible episode stream, rather than replaying one match per worker.
  engine_seed_mode: mappo
  representation: simple115v2
  rewards: scoring,checkpoints
  team_reward: mean
  time_limit: 400
  stacked: False
  render: False
  write_video: False
  write_full_episode_dumps: False
  write_goal_dumps: False
  number_of_right_players_agent_controls: 0
scenarios:
  3_vs_1:
    map_name: academy_3_vs_1_with_keeper
    num_agents: 3
  counterattack_easy:
    map_name: academy_counterattack_easy
    num_agents: 4
  counterattack_hard:
    map_name: academy_counterattack_hard
    num_agents: 4
  pass_and_shoot:
    map_name: academy_pass_and_shoot_with_keeper
    num_agents: 2
