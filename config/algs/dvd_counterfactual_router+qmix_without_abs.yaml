# BM-protected counterfactual routing between BM and DVD credit weights.
# The route is learned per transition; no t_env schedule or manual release is used.

action_selector: "epsilon_greedy"
epsilon_start: 0.75
epsilon_finish: 0.05
epsilon_anneal_time: 500000

runner: "parallel"
batch_size_run: 4
buffer_size: 2500
batch_size: 64
optimizer: "adam"

t_max: 10050000
target_update_interval: 200

mac: "n_mac"
agent: "n_rnn"
agent_output_type: q

learner: "dvd_nq_learner_with_sarsa"
mixer: "dvd_counterfactual_router"
abs: False
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001
td_lambda: 0.3
q_lambda: False

use_layer_norm: False
use_orthogonal: False
gain: 0.01

use_per: False
per_alpha: 0.6
per_beta: 0.4
return_priority: False

use_rnd: True
rnd_beta: 0.01
rnd_lr: 0.0005
state_shape: 0

dvd_heads: 8
gat_embed_dim: 32
rnn_hidden_dim: 64

adaptive_bm_abs: False
adaptive_gate_hidden_dim: 32
adaptive_gate_max: 1.0
adaptive_gate_init: 0.05
adaptive_norm_eps: 0.000001

# Keep agent learning BM-dominant: the normalized 0.25:1 mix/BM ratio gives
# 20% mixed-value and 80% pure-BM value gradients. The DVD auxiliary objective
# updates only GAT/DVD parameters. A positive route target requires both a
# relative improvement and an absolute TD-error reduction of at least 0.01.
counterfactual_mix_loss_weight: 0.25
counterfactual_bm_loss_weight: 1.0
counterfactual_dvd_loss_weight: 0.1
counterfactual_route_loss_weight: 0.1
counterfactual_sparse_weight: 0.0
counterfactual_route_margin: 0.05
counterfactual_route_min_abs_advantage: 0.01
counterfactual_route_eps: 0.000001

name: "dvd_counterfactual_router+qmix_without_abs"
