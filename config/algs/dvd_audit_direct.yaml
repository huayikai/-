# Direct BM + trajectory-graph control. Launch with main_audit.py.
# Signed raw trajectory W1; matched BM b1/W2/b2; one TD loss and own target.
action_selector: "epsilon_greedy"
epsilon_start: 0.75
epsilon_finish: 0.05
epsilon_anneal_time: 500000
runner: "parallel"
batch_size_run: 4
buffer_size: 2500
batch_size: 64
optimizer: "adam"
t_max: 5050000
target_update_interval: 200
mac: "n_mac"
agent: "n_rnn"
agent_output_type: q
learner: "dvd_audit_learner"
mixer: "dvd_direct"
abs: False
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001
td_lambda: 0.3
q_lambda: False
use_layer_norm: False
use_orthogonal: False
gain: 0.01
use_per: False
per_alpha: 0.6
per_beta: 0.4
return_priority: False
use_rnd: True
rnd_beta: 0.01
rnd_lr: 0.0005
state_shape: 0
dvd_heads: 8
gat_embed_dim: 32
rnn_hidden_dim: 64
audit_fix_td_lambda: True
# The generic learner logs this as false for a non-router; there is no aux loss.
audit_isolate_dvd_aux_hidden: False
# Match the map's main BACM path: False for 3s, True for 6h.
audit_detach_mixed_hidden: False
use_tensorboard: True
test_nepisode: 32
test_interval: 10000
name: "dvd_audit_direct"
